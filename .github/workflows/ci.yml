name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm ci
      - run: npm test
      # The vendored shared stylesheet must match the hash pinned when it was last re-vendored.
      - run: bash scripts/check-ui-standard.sh

  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm ci
      # Mock mode needs no settings. The doctor runs the netguard self-test and the in-process health route.
      - run: npm run doctor
        env:
          PORT: "5549"

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The checker lives in the demo-kit-base repo (it is not shipped into demo repos yet). Hosted runners cannot read
      # that repo without a token. The owner sets the repository secret DEMO_KIT_BASE_TOKEN (read access) and the
      # repository variable DEMO_KIT_BASE_REPO (owner/name). Until both exist this job FAILS, so a green rollup always
      # means the check ran. Pull requests from forks cannot read secrets, so they only warn.
      - name: Rule conformance (--new)
        env:
          DEMO_KIT_BASE_TOKEN: ${{ secrets.DEMO_KIT_BASE_TOKEN }}
          DEMO_KIT_BASE_REPO: ${{ vars.DEMO_KIT_BASE_REPO }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -z "$DEMO_KIT_BASE_TOKEN" ] || [ -z "$DEMO_KIT_BASE_REPO" ]; then
            if [ "$FORK_PR" = "true" ]; then echo "::warning::conformance NOT RUN (fork PR cannot read secrets)"; exit 0; fi
            echo "::error::conformance cannot run: set the secret DEMO_KIT_BASE_TOKEN and the variable DEMO_KIT_BASE_REPO"; exit 1
          fi
          git clone --depth 1 "https://x-access-token:${DEMO_KIT_BASE_TOKEN}@github.com/${DEMO_KIT_BASE_REPO}.git" "$RUNNER_TEMP/demo-kit-base"
          node "$RUNNER_TEMP/demo-kit-base/scripts/conformance.mjs" . --new

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      # Mock mode needs no .env and no certificate. The compose file publishes 127.0.0.1 only.
      - run: docker compose up -d
      - name: Health and page, by content
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5500/api/health > health.json && break; sleep 2; done
          cat health.json
          grep -q '"schema":"demo-health/1"' health.json
          grep -q '"runtime":"offline"' health.json
          curl -fsS http://127.0.0.1:5500/ | grep -q 'id="root"'
          curl -fsS http://127.0.0.1:5500/api/config | grep -q '"allowed":true'
      - if: always()
        run: docker compose down -v

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # All 11 flows in Mock through the real UI, the Playground Tokens tab, and zero requests off the lab's origin.
      - run: npm run smoke

  forbidden-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan history and tree (counts only, list never printed)
        env:
          FORBIDDEN_STRINGS: ${{ secrets.FORBIDDEN_STRINGS }}
        run: |
          list="$RUNNER_TEMP/forbidden.txt"
          printf '%s\n' "$FORBIDDEN_STRINGS" | grep -v '^$' > "$list" || true
          test -s "$list" || { echo "FORBIDDEN_STRINGS secret is empty"; exit 1; }
          hist=$(git log -p --all | grep -cF -f "$list" || true)
          tree=$(git grep -l -F -f "$list" -- . || true)
          tree_count=$(printf '%s' "$tree" | grep -c . || true)
          echo "history hits: $hist"
          echo "tree files with hits: $tree_count"
          test "$hist" = "0" && test "$tree_count" = "0"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version
      - name: Scan history
        run: ./gitleaks detect --source . --redact --no-banner
