# PingOne Lab in Docker (OrbStack), mock mode, no setup:   docker compose up --build -d   ->  http://127.0.0.1:5500
# Nothing else is needed: no .env, no certificate, no PingOne. The mock PingOne runs inside the lab.
# For your own PingOne (live mode) and https, add docker-compose.live.yml (see the README, "Docker").
# Do not change the 127.0.0.1 below: the lab has no sign-in of its own, so it must stay on loopback.
name: pingone-lab

services:
  pingone-lab:
    build: .
    ports:
      - "127.0.0.1:5500:5500"
    environment:
      SHELF_URL: ${SHELF_URL:-}
      PORT: "5500"
      LAB_BIND: 0.0.0.0
      # Inside the container the lab binds 0.0.0.0, but the port above is published on 127.0.0.1 only. The lab
      # only honours this flag when the process really is in a container (/.dockerenv or the cgroup of process 1).
      LAB_IN_CONTAINER: "1"
      # Mock mode: allow signing in to the mock PingOne's demo user (rule 11). Mock sign-in is still refused
      # behind a proxy. Live mode is not affected. (NODE_ENV=production is not a guard; the image sets it.)
      ALLOW_MOCK_SIGNIN: "1"
      P1LAB_SETTINGS_FILE: /config/pingone-lab.json
      # The family's shared env file is not mounted: set the environment on the Settings page instead.
      P1LAB_SHARED_FILE: ""
      # Extra names the lab answers to besides 127.0.0.1 and localhost; every other Host is still refused.
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-}
    volumes:
      # The lab's own settings (mode and, in live mode, your PingOne environment and clients). A named volume, so a
      # fresh clone needs no folder; docker-compose.live.yml swaps it for your settings folder.
      - lab-config:/config
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # http, or https when the live override gives the lab a certificate.
      test: ["CMD", "node", "-e", "const t=process.env.LAB_TLS_CERT?'https':'http';require(t).get({host:'127.0.0.1',port:5500,path:'/api/health',rejectUnauthorized:false},r=>{let b='';r.on('data',d=>b+=d);r.on('end',()=>{try{process.exit(JSON.parse(b).state==='ready'?0:1)}catch{process.exit(1)}})}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  lab-config:
